name: tests

on:
  push:
    paths-ignore: ["**.md", "outputs/**"]
  pull_request:
    paths-ignore: ["**.md", "outputs/**"]
  workflow_dispatch:
    inputs:
      live:
        description: "Also run live Gemini tests (10 API calls)"
        type: boolean
        default: false

jobs:
  offline:
    name: Offline tests (no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest -v

  live:
    name: Live Gemini tests
    needs: offline
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run live tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: pytest -m live -x -v